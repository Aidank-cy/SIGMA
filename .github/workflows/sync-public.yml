name: Sync to public repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove private files
        run: |
          shopt -s globstar nullglob

          if [ ! -f .sync-filter ]; then
            echo ".sync-filter is required for public sync."
            exit 1
          fi

          # Read file into memory BEFORE any deletions
          FILTER_CONTENT=$(cat .sync-filter)

          # First pass: delete matching files
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            case "$pattern" in
              ""|\#*) continue ;;
              !*) continue ;;
            esac
            echo "Filtering: $pattern"
            rm -rf -- $pattern
          done <<< "$FILTER_CONTENT"

          # Second pass: restore negated patterns
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            case "$pattern" in
              !*)
                keep="${pattern#!}"
                git checkout -- "$keep" 2>/dev/null || true
                ;;
            esac
          done <<< "$FILTER_CONTENT"

      - name: Push to public repo
        env:
          TOKEN: ${{ secrets.SIGMA_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git config credential.helper store
          echo "https://Aidank-cy:${TOKEN}@github.com" > ~/.git-credentials

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync, skipping."
            exit 0
          fi

          git commit -m "sync: mirror from dev"
          git remote add public https://github.com/Aidank-cy/SIGMA.git
          git push public HEAD:main --force
