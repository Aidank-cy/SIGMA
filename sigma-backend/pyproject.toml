[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-backend"
version = "2.0.0"
description = "SIGMA FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.1",
  "aiosqlite>=0.20.0",
  "apscheduler>=3.10.4",
  "asyncpg>=0.29.0",
  "bcrypt>=4.0.1,<4.1",
  "beautifulsoup4>=4.12.3",
  "email-validator>=2.1.1",
  "fastapi>=0.110.0",
  "feedparser>=6.0.11",
  "greenlet>=3.0.3",
  "gunicorn>=22.0.0",
  "httpx>=0.27.0",
  "passlib[bcrypt]>=1.7.4",
  "pydantic-settings>=2.2.1",
  "pydantic>=2.6.4,<2.14",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.3",
  "resend[async]>=2.28.1",
  "sqlalchemy>=2.0.29",
  "uvicorn[standard]>=0.29.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.1",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.3.5"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["TC003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
